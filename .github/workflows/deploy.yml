# Deploy workflow — builds and deploys the Xfin web monorepo to Firebase Hosting.
#
# PREREQUISITE: The repo owner must create the GitHub secret
# `FIREBASE_SERVICE_ACCOUNT_XFIN` containing the Firebase service-account JSON
# for the `xfin-data-payout` project before this workflow can deploy.
# Generate it at: Firebase Console → Project Settings → Service accounts →
# "Generate new private key", then add it to:
# GitHub repo → Settings → Secrets and variables → Actions → New repository secret.

name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (turbo + assemble public/)
        # VITE_* vars are public client config — store as repo Variables (not Secrets):
        # GitHub repo → Settings → Secrets and variables → Actions → Variables tab.
        # Required variables: VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
        # VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID, VITE_API_BASE_URL.
        # TODO: set real Firebase web config as repo variables before deploying apps/app.
        run: pnpm build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_XFIN }}
          channelId: live
          projectId: xfin-data-payout
