name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@10.28.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Next.js Application
        run: pnpm build

      - name: Inform missing Firebase credentials
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_XFIN_FINANCIAL_INFRA }}
        if: ${{ env.FIREBASE_KEY == '' }}
        run: |
          echo "::warning title=Deploy Skipped::O build foi validado com sucesso, mas o secret 'FIREBASE_SERVICE_ACCOUNT_XFIN_FINANCIAL_INFRA' não está configurado."
          echo "O deploy para o Firebase Hosting (projeto 'xfin-financial-infra') será disparado automaticamente assim que o secret FIREBASE_SERVICE_ACCOUNT_XFIN_FINANCIAL_INFRA for adicionado em Settings > Secrets and variables > Actions."

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_XFIN_FINANCIAL_INFRA }}
        if: ${{ env.FIREBASE_KEY != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_XFIN_FINANCIAL_INFRA }}'
          channelId: live
          projectId: xfin-financial-infra
